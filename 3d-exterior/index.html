<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Exterior | Vastu Developers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .gallery-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .gallery-item-info {
            padding: 20px;
            text-align: center;
        }

        .gallery-item-info h3 {
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content img {
            width: 100%;
            height: auto;
            max-height: 85vh;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .modal-nav button {
            pointer-events: all;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .modal-nav button:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
        }

        footer p {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
            }

            .modal-content {
                max-width: 95%;
                max-height: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>3D Exterior Designs</h1>
            <p>Explore our stunning collection of exterior design visualizations</p>
        </header>

        <div class="gallery" id="gallery"></div>

        <footer>
            <p>&copy; 2024 Vastu Developers. All rights reserved.</p>
        </footer>
    </div>

    <!-- Modal for full image view -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-nav">
                <button onclick="previousImage()">&lt;</button>
                <button onclick="nextImage()">&gt;</button>
            </div>
            <img id="modalImage" src="" alt="Full view">
        </div>
    </div>

    <script>
        const images = [
            { name: 'Exterior Design 1', file: 'Exterior Design 1.JPG' },
            { name: 'Exterior Design 2', file: 'Exterior Design 2.JPG' },
            { name: 'Exterior Design 3', file: 'Exterior Design 3.JPG' },
            { name: 'Exterior Design 4', file: 'Exterior Design 4.JPG' },
            { name: 'Exterior Design 5', file: 'Exterior Design 5.JPG' },
            { name: 'Exterior Design 6', file: 'Exterior Design 6.JPG' },
            { name: 'Exterior Design 7', file: 'Exterior Design 7.JPG' },
            { name: 'Exterior Design 8', file: 'Exterior Design 8.JPG' },
            { name: 'Exterior Design 9', file: 'Exterior Design 9.JPG' },
            { name: 'Exterior Design 10', file: 'Exterior Design 10.JPG' }
        ];

        let currentImageIndex = 0;

        function initGallery() {
            const gallery = document.getElementById('gallery');
            images.forEach((image, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <img src="../images/3d-exterior/${image.file}" alt="${image.name}" onclick="openModal(${index})">
                    <div class="gallery-item-info">
                        <h3>${image.name}</h3>
                    </div>
                `;
                gallery.appendChild(item);
            });
        }

        function openModal(index) {
            currentImageIndex = index;
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = `../images/3d-exterior/${images[index].file}`;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % images.length;
            document.getElementById('modalImage').src = `../images/3d-exterior/${images[currentImageIndex].file}`;
        }

        function previousImage() {
            currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
            document.getElementById('modalImage').src = `../images/3d-exterior/${images[currentImageIndex].file}`;
        }

        // Close modal when clicking outside
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            const modal = document.getElementById('imageModal');
            if (modal.classList.contains('active')) {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') previousImage();
                if (e.key === 'Escape') closeModal();
            }
        });

        // Initialize gallery on load
        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
